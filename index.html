  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var TOKEN = "8508235359:AAGUO333L5iZze1d9QqJVZyK_cOCIjGmgj4";
        var CHAT = "-5314461466";
        var COOLDOWN_MS = 10 * 60 * 1000;
        var STORAGE_KEY = "portfolio_visit_last_telegram_ping";

        function escapeMarkdown(value) {
          return String(value).replace(/([_*`\[])/g, "\\$1");
        }

        function getBrowserName() {
          var ua = navigator.userAgent || "";
          if (/Edg\//.test(ua)) return "Edge";
          if (/OPR\//.test(ua) || /Opera/.test(ua)) return "Opera";
          if (/Chrome\//.test(ua) || /CriOS\//.test(ua)) return "Chrome";
          if (/Firefox\//.test(ua)) return "Firefox";
          if (/Safari\//.test(ua) && /Version\//.test(ua)) return "Safari";
          if (/MSIE|Trident\//.test(ua)) return "Internet Explorer";
          return "Unknown";
        }

        try {
          var lastSent = Number(localStorage.getItem(STORAGE_KEY) || "0");
          var now = Date.now();
          if (lastSent && now - lastSent < COOLDOWN_MS) return;
          localStorage.setItem(STORAGE_KEY, String(now));

          var timeIST = new Date().toLocaleString("en-IN", {
            timeZone: "Asia/Kolkata",
            year: "numeric",
            month: "short",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
          });
          var referrer = document.referrer || "Direct / unknown";
          var isMobile = /Android|iPhone|iPad|iPod|Mobi|Opera Mini|IEMobile/i.test(
            navigator.userAgent || ""
          );
          var deviceType = isMobile ? "Mobile" : "Desktop";
          var browser = getBrowserName();
          var language = navigator.language || "Unknown";
          var resolution = window.screen.width + "x" + window.screen.height;

          var message = [
            "\uD83D\uDC40 New portfolio visit!",
            "",
            "*Time (IST):* " + escapeMarkdown(timeIST),
            "*Referrer:* " + escapeMarkdown(referrer),
            "*Device:* " + escapeMarkdown(deviceType),
            "*Browser:* " + escapeMarkdown(browser),
            "*Language:* " + escapeMarkdown(language),
            "*Resolution:* " + escapeMarkdown(resolution)
          ].join("\n");

          fetch("https://api.telegram.org/bot" + TOKEN + "/sendMessage", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: CHAT,
              text: message,
              parse_mode: "Markdown",
              disable_web_page_preview: true
            }),
            keepalive: true
          }).catch(function () {});
        } catch (error) {
          // Prevent this tracker from breaking page render.
        }
      })();
    </script>
